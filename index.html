<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaïlight - Connexion</title>
    <style>
        /* --- DESIGN (CSS) --- */
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Le fond dégradé doux */
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        /* La boîte centrale (comme l'écran du téléphone) */
        .phone-screen {
            background-color: white;
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 320px; /* Largeur d'un téléphone standard */
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
            color: #333;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Champs de texte */
        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 12px;
            background-color: #f9f9f9;
            box-sizing: border-box; /* Important pour l'alignement */
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #a1c4fd;
            background-color: white;
            box-shadow: 0 0 0 4px rgba(161, 196, 253, 0.1);
        }

        /* Boutons */
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-login {
            background: linear-gradient(to right, #a1c4fd 0%, #c2e9fb 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(161, 196, 253, 0.4);
            margin-top: 10px;
        }

        .btn-signup {
            background-color: transparent;
            color: #777;
            font-size: 13px;
            font-weight: normal;
            margin-top: 10px;
        }

        .btn-signup:hover {
            color: #333;
            text-decoration: underline;
        }

        /* Logo simulé par du texte pour l'instant */
        .logo-placeholder {
            font-size: 50px;
            margin-bottom: 10px;
        }

    </style>
</head>
<body>

    <div class="phone-screen">
        <div class="logo-placeholder">✨</div>
        <h1>Kaïlight</h1>
        <p class="subtitle">Connecte-toi à ton mood.</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <input type="email" id="email" placeholder="Email" required>
            <br><br> <input type="password" id="password" placeholder="Mot de passe" required>
            
            <button type="submit" class="btn-login">Se connecter</button>
            <button type="button" class="btn-signup" onclick="alert('Redirection vers Inscription...')">Pas de compte ? S'inscrire</button>
        </form>
    </div>

    <script>
        /* --- LOGIQUE (JAVASCRIPT) --- */
        
        function handleLogin(event) {
            // Empêche la page de se recharger
            event.preventDefault();

            // Récupère les valeurs
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Simulation de connexion
            if(password.length < 6) {
                alert("Le mot de passe est trop court !");
            } else {
                // C'est ici que normalement on enverrait les données à une base de données
                console.log("Email:", email);
                console.log("Mdp:", password);
                alert("Bienvenue sur Kaïlight, " + email + " ! (Ceci est une démo)");
            }
        }
    </script>

</body>
</html>
