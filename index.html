<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geometry Dash Deluxe</title>
    <style>
        :root { --main-color: #00ff00; --bg-color: #0a0a1a; }
        body { margin: 0; background: var(--bg-color); color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; filter: drop-shadow(0 0 5px rgba(0, 255, 255, 0.3)); }
        
        .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 10; }
        .hidden { display: none !important; }

        h1 { font-size: 3rem; text-shadow: 0 0 20px var(--main-color); margin-bottom: 20px; }
        button { 
            padding: 15px 40px; margin: 10px; font-size: 1.2rem; cursor: pointer;
            background: transparent; border: 2px solid var(--main-color); color: white;
            border-radius: 8px; transition: 0.3s; text-transform: uppercase; font-weight: bold;
        }
        button:hover { background: var(--main-color); box-shadow: 0 0 20px var(--main-color); color: black; }
        
        .difficulty-btns { display: flex; gap: 10px; }
        #editor-ui { position: absolute; bottom: 20px; left: 20px; z-index: 5; }
    </style>
</head>
<body>

    <div id="main-menu" class="overlay">
        <h1>GEOMETRY DASH</h1>
        <button onclick="showDifficulty()">JOUER</button>
        <button onclick="startEditor()">ÉDITEUR DE NIVEAU</button>
    </div>

    <div id="difficulty-menu" class="overlay hidden">
        <h1>DIFFICULTÉ</h1>
        <div class="difficulty-btns">
            <button onclick="startGame(4, 120)">FACILE</button>
            <button onclick="startGame(7, 80)">NORMAL</button>
            <button onclick="startGame(10, 50)">DÉMON</button>
        </div>
        <button onclick="backToMain()" style="border-color: #ff4444; font-size: 0.8rem;">RETOUR</button>
    </div>

    <div id="editor-ui" class="hidden">
        <button onclick="saveAndPlay()">JOUER MON NIVEAU</button>
        <button onclick="backToMain()">QUITTER</button>
        <p>Tape sur le sol pour placer un pique !</p>
    </div>

    <canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    
    let state = 'MENU'; // MENU, PLAYING, EDITOR
    let gameSpeed = 6;
    let spawnRate = 80;
    let score = 0;
    let obstacles = [];
    let particles = [];
    let customLevel = [];

    const player = { x: 100, y: 0, size: 40, dy: 0, gravity: 0.7, jumpForce: 13, grounded: false, angle: 0 };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- LOGIQUE MENU ---
    function showDifficulty() { document.getElementById('main-menu').classList.add('hidden'); document.getElementById('difficulty-menu').classList.remove('hidden'); }
    function backToMain() { location.reload(); }

    function startGame(speed, rate, level = []) {
        gameSpeed = speed;
        spawnRate = rate;
        state = 'PLAYING';
        document.getElementById('difficulty-menu').classList.add('hidden');
        document.getElementById('editor-ui').classList.add('hidden');
        if(level.length > 0) obstacles = [...level];
        animate();
    }

    function startEditor() {
        state = 'EDITOR';
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('editor-ui').classList.remove('hidden');
        animate();
    }

    // --- SYSTÈME DE PARTICULES ---
    function createParticles(x, y) {
        for(let i=0; i<5; i++) {
            particles.push({ x, y, dx: Math.random()*2-1, dy: Math.random()*2-1, life: 1, size: Math.random()*5 });
        }
    }

    // --- BOUCLE DE JEU ---
    function animate() {
        if (state === 'MENU') return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const floorY = canvas.height - 60;

        // Dessin du Sol
        ctx.fillStyle = "#111";
        ctx.fillRect(0, floorY, canvas.width, 60);
        ctx.strokeStyle = "#00ffff";
        ctx.strokeRect(0, floorY, canvas.width, 2);

        if (state === 'PLAYING') {
            updatePlayer(floorY);
            updateObstacles(floorY);
            drawScore();
        } else if (state === 'EDITOR') {
            drawEditorLevel(floorY);
        }

        drawParticles();
        drawPlayer();
        requestAnimationFrame(animate);
    }

    function updatePlayer(floorY) {
        player.dy += player.gravity;
        player.y += player.dy;

        if (player.y + player.size > floorY) {
            player.y = floorY - player.size;
            player.dy = 0;
            player.grounded = true;
            if (Math.abs(player.dy) < 1) createParticles(player.x, floorY);
        }

        if (!player.grounded) player.angle += 0.15;
        else player.angle = Math.round(player.angle / (Math.PI/2)) * (Math.PI/2);
    }

    function updateObstacles(floorY) {
        if (customLevel.length === 0 && Math.floor(Date.now()/20) % spawnRate === 0) {
            obstacles.push({ x: canvas.width, y: floorY - 40, w: 30, h: 40 });
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].x -= gameSpeed;
            
            // Draw Spike
            ctx.fillStyle = "#ff4444";
            ctx.shadowBlur = 15; ctx.shadowColor = "red";
            ctx.beginPath();
            ctx.moveTo(obstacles[i].x, floorY);
            ctx.lineTo(obstacles[i].x + obstacles[i].w/2, floorY - obstacles[i].h);
            ctx.lineTo(obstacles[i].x + obstacles[i].w, floorY);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Collision
            if (player.x < obstacles[i].x + obstacles[i].w && player.x + player.size > obstacles[i].x &&
                player.y + player.size > floorY - obstacles[i].h) {
                state = 'MENU';
                alert("BOUM ! Score: " + score);
                location.reload();
            }

            if (obstacles[i].x + obstacles[i].w < 0) {
                obstacles.splice(i, 1);
                score++;
            }
        }
    }

    function drawPlayer() {
        ctx.save();
        ctx.translate(player.x + player.size/2, player.y + player.size/2);
        ctx.rotate(player.angle);
        ctx.shadowBlur = 15; ctx.shadowColor = "#00ff00";
        ctx.fillStyle = "#00ff00";
        ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
        ctx.strokeStyle = "white";
        ctx.lineWidth = 3;
        ctx.strokeRect(-player.size/2, -player.size/2, player.size, player.size);
        ctx.restore();
        ctx.shadowBlur = 0;
    }

    function drawParticles() {
        particles.forEach((p, i) => {
            p.x += p.dx; p.y += p.dy; p.life -= 0.02;
            ctx.fillStyle = `rgba(0, 255, 255, ${p.life})`;
            ctx.fillRect(p.x, p.y, p.size, p.size);
            if(p.life <= 0) particles.splice(i, 1);
        });
    }

    function drawScore() {
        ctx.fillStyle = "white";
        ctx.font = "bold 24px Arial";
        ctx.fillText("SCORE: " + score, 20, 40);
    }

    // --- FONCTIONS ÉDITEUR ---
    function drawEditorLevel(floorY) {
        customLevel.forEach(ob => {
            ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
            ctx.beginPath();
            ctx.moveTo(ob.x, floorY);
            ctx.lineTo(ob.x + 15, floorY - 40);
            ctx.lineTo(ob.x + 30, floorY);
            ctx.fill();
        });
    }

    function saveAndPlay() {
        obstacles = customLevel.map(ob => ({...ob, w: 30, h: 40}));
        startGame(7, 9999); // On désactive le spawn auto
    }

    // --- INPUTS ---
    function handleInput(e) {
        if (state === 'PLAYING' && player.grounded) {
            player.dy = -player.jumpForce;
            player.grounded = false;
        } else if (state === 'EDITOR') {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            customLevel.push({ x: x, y: canvas.height - 100 });
        }
    }

    window.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(e); }, {passive: false});
    window.addEventListener('mousedown', handleInput);
    window.addEventListener('keydown', (e) => { if(e.code === "Space") handleInput(e); });

</script>
</body>
</html>
