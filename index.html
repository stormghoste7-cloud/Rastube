<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibes - Connexion</title>
    <style>
        /* --- DESIGN (CSS) --- */
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Nouveau dégradé plus "Vibe" (Bleu nuit vers violet) */
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .phone-screen {
            background-color: white;
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 320px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative; /* Pour positionner les messages */
        }

        h1 {
            margin: 0;
            font-size: 36px;
            font-weight: 800;
            /* Dégradé de texte pour le logo Vibes */
            background: -webkit-linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 12px;
            background-color: #f9f9f9;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #764ba2;
            background-color: white;
            box-shadow: 0 0 0 4px rgba(118, 75, 162, 0.1);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-login {
            /* Dégradé Vibes */
            background: linear-gradient(to right, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.3);
            margin-top: 10px;
        }

        .btn-signup {
            background-color: transparent;
            color: #777;
            font-size: 13px;
            font-weight: normal;
            margin-top: 5px;
        }

        .btn-signup:hover {
            color: #333;
            text-decoration: underline;
        }

        /* Message d'erreur ou de succès */
        #feedback-message {
            font-size: 13px;
            margin-top: 10px;
            min-height: 20px; /* Garde la place pour éviter que ça saute */
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .error { color: #e74c3c; }
        .success { color: #2ecc71; }

    </style>
</head>
<body>

    <div class="phone-screen">
        <div style="font-size: 40px;">🌊</div> <h1>Vibes</h1>
        <p class="subtitle">Catch the right mood.</p>

        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" required>
            <br><br>
            <input type="password" id="password" placeholder="Mot de passe" required>
            
            <button type="submit" class="btn-login" id="submitBtn">Se connecter</button>
            <button type="button" class="btn-signup" onclick="toggleMode()">Pas de compte ? Créer un profil</button>
        </form>

        <div id="feedback-message"></div>
    </div>

    <script>
        /* --- LOGIQUE (JAVASCRIPT) --- */

        const loginForm = document.getElementById('loginForm');
        const feedback = document.getElementById('feedback-message');
        const submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', function(event) {
            // 1. On empêche le rechargement de la page (Bug fix)
            event.preventDefault();

            // 2. On récupère les infos
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // 3. Petit effet de chargement
            submitBtn.textContent = "Connexion...";
            submitBtn.style.opacity = "0.7";
            feedback.style.opacity = "0";

            // 4. Simulation de vérification (délai de 1 seconde)
            setTimeout(() => {
                submitBtn.textContent = "Se connecter";
                submitBtn.style.opacity = "1";

                if (password.length < 6) {
                    // Erreur
                    feedback.textContent = "Le mot de passe est trop court ! (min 6 caractères)";
                    feedback.className = "error";
                    feedback.style.opacity = "1";
                } else {
                    // Succès
                    feedback.textContent = "Bienvenue sur Vibes, " + email + " !";
                    feedback.className = "success";
                    feedback.style.opacity = "1";
                    
                    // Ici, on pourrait rediriger vers la page d'accueil
                    console.log("Utilisateur connecté : " + email);
                }
            }, 1000);
        });

        function toggleMode() {
            feedback.textContent = "La page d'inscription arrive bientôt !";
            feedback.className = ""; // Ni erreur ni succès, juste info
            feedback.style.opacity = "1";
        }
    </script>

</body>
</html>
