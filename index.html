<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash JS - Single File</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #111;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        canvas {
            border: 4px solid #fff;
            background: linear-gradient(#0072ff, #00c6ff);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    canvas.width = 800;
    canvas.height = 400;

    // --- Paramètres ---
    let score = 0;
    let gameOver = false;

    const player = {
        x: 80,
        y: 300,
        size: 35,
        color: "#00ff00",
        dy: 0,
        jumpForce: 10,
        gravity: 0.5,
        grounded: false,
        angle: 0 // Pour l'effet de rotation
    };

    const obstacles = [];
    let frame = 0;

    // --- Fonctions ---
    function spawnObstacle() {
        if (frame % 100 === 0) { // Un obstacle toutes les 100 frames
            obstacles.push({
                x: canvas.width,
                y: canvas.height - 55,
                w: 30,
                h: 35,
                color: "#ff0000"
            });
        }
    }

    function update() {
        if (gameOver) return;

        frame++;
        
        // Physique Joueur
        player.dy += player.gravity;
        player.y += player.dy;

        // Collision Sol
        if (player.y + player.size > canvas.height - 20) {
            player.y = canvas.height - 20 - player.size;
            player.dy = 0;
            player.grounded = true;
        }

        // Animation de rotation (seulement en l'air)
        if (!player.grounded) {
            player.angle += 0.15;
        } else {
            player.angle = Math.round(player.angle / (Math.PI/2)) * (Math.PI/2);
        }

        // Gestion Obstacles
        spawnObstacle();
        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].x -= 5; // Vitesse du jeu

            // Collision AABB
            if (
                player.x < obstacles[i].x + obstacles[i].w &&
                player.x + player.size > obstacles[i].x &&
                player.y < obstacles[i].y + obstacles[i].h &&
                player.y + player.size > obstacles[i].y
            ) {
                alert("Game Over ! Score : " + Math.floor(frame/10));
                location.reload(); // Redémarre le jeu
            }

            // Supprimer obstacles hors écran
            if (obstacles[i].x + obstacles[i].w < 0) {
                obstacles.splice(i, 1);
            }
        }

        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Sol
        ctx.fillStyle = "#222";
        ctx.fillRect(0, canvas.height - 20, canvas.width, 20);

        // Joueur avec Rotation
        ctx.save();
        ctx.translate(player.x + player.size/2, player.y + player.size/2);
        ctx.rotate(player.angle);
        ctx.fillStyle = player.color;
        ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.strokeRect(-player.size/2, -player.size/2, player.size, player.size);
        ctx.restore();

        // Obstacles (Piques simplifiés en rectangles pour ce code)
        ctx.fillStyle = "#ff0000";
        obstacles.forEach(ob => {
            ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
        });
    }

    // --- Contrôles ---
    window.addEventListener('keydown', (e) => {
        if ((e.code === "Space" || e.code === "ArrowUp") && player.grounded) {
            player.dy = -player.jumpForce;
            player.grounded = false;
        }
    });

    update();
</script>
</body>
</html>
