<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GD Mobile Edition</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            touch-action: none; /* Empêche le zoom/scroll accidentel */
            font-family: 'Segoe UI', sans-serif;
        }
        canvas {
            display: block;
            background: linear-gradient(#1e3c72, #2a5298);
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">Score: <span id="score">0</span></div>
    <canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    // Adaptation mobile
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let score = 0;
    let gameOver = false;
    const groundHeight = 40;

    const player = {
        x: canvas.width * 0.15,
        y: 0,
        size: 40,
        dy: 0,
        jumpForce: 13,
        gravity: 0.7,
        grounded: false,
        angle: 0
    };

    const obstacles = [];
    let frame = 0;

    function jump() {
        if (player.grounded) {
            player.dy = -player.jumpForce;
            player.grounded = false;
        }
        if (gameOver) location.reload();
    }

    // Événements Tactiles et Clavier
    window.addEventListener('touchstart', (e) => {
        e.preventDefault(); 
        jump();
    }, { passive: false });

    window.addEventListener('mousedown', jump);
    window.addEventListener('keydown', (e) => { if(e.code === "Space") jump(); });

    function update() {
        if (gameOver) return;
        frame++;

        // Physique
        player.dy += player.gravity;
        player.y += player.dy;

        // Sol
        const floorY = canvas.height - groundHeight;
        if (player.y + player.size > floorY) {
            player.y = floorY - player.size;
            player.dy = 0;
            player.grounded = true;
        }

        // Obstacles (Plus espacés sur mobile pour la jouabilité)
        if (frame % 80 === 0) {
            obstacles.push({
                x: canvas.width,
                y: floorY - 40,
                w: 30,
                h: 40
            });
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].x -= 6; // Vitesse

            // Collision
            if (
                player.x < obstacles[i].x + obstacles[i].w &&
                player.x + player.size > obstacles[i].x &&
                player.y < obstacles[i].y + obstacles[i].h &&
                player.y + player.size > obstacles[i].y
            ) {
                gameOver = true;
                setTimeout(() => location.reload(), 1000);
            }

            if (obstacles[i].x + obstacles[i].w < 0) {
                obstacles.splice(i, 1);
                score++;
                scoreEl.innerText = score;
            }
        }

        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Sol stylisé
        ctx.fillStyle = "#111";
        ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
        ctx.strokeStyle = "#00ffff";
        ctx.lineWidth = 3;
        ctx.strokeRect(0, canvas.height - groundHeight, canvas.width, 1);

        // Joueur
        ctx.save();
        ctx.translate(player.x + player.size/2, player.y + player.size/2);
        if (!player.grounded) player.angle += 0.15;
        else player.angle = 0;
        ctx.rotate(player.angle);
        
        ctx.fillStyle = "#00ff00";
        ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
        ctx.strokeStyle = "white";
        ctx.strokeRect(-player.size/2, -player.size/2, player.size, player.size);
        ctx.restore();

        // Obstacles (Piques triangulaires)
        ctx.fillStyle = "#ff4444";
        obstacles.forEach(ob => {
            ctx.beginPath();
            ctx.moveTo(ob.x, ob.y + ob.h);
            ctx.lineTo(ob.x + ob.w / 2, ob.y);
            ctx.lineTo(ob.x + ob.w, ob.y + ob.h);
            ctx.fill();
        });
    }

    update();
</script>
</body>
</html>
