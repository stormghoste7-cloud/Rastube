<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GD Fix Edition</title>
    <style>
        :root { --neon: #00ff00; }
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        
        /* Debug Console - Pour voir ce qui se passe sur mobile */
        #debug { position: absolute; top: 5px; right: 5px; font-size: 10px; color: #555; pointer-events: none; }

        .menu-layer {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: rgba(0,0,0,0.8); z-index: 1000;
        }
        .hidden { display: none !important; }

        .btn {
            background: var(--neon); color: #000;
            padding: 20px 60px; border: none; border-radius: 10px;
            font-weight: bold; font-size: 20px; cursor: pointer;
            margin: 10px; box-shadow: 0 0 20px var(--neon);
        }
    </style>
</head>
<body>

    <div id="debug">Console: OK</div>

    <div id="ui-main" class="menu-layer">
        <h1 style="color:white; text-shadow: 0 0 10px var(--neon);">GEOMETRY DASH</h1>
        <button class="btn" id="playBtn">JOUER</button>
        <button class="btn" id="editBtn" style="background:transparent; border:2px solid var(--neon); color:white;">ÉDITEUR</button>
    </div>

    <canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const debug = document.getElementById('debug');

    function log(msg) { debug.innerText = "Log: " + msg; console.log(msg); }

    // Configuration
    let state = 'MENU';
    let player = { x: 100, y: 0, size: 40, dy: 0, gravity: 0.8, jump: -14, grounded: false };
    let obstacles = [];

    // Redimensionnement
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- ACTIONS DES BOUTONS ---
    document.getElementById('playBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        log("Bouton Jouer cliqué");
        startLevel();
    });

    document.getElementById('playBtn').addEventListener('touchstart', (e) => {
        e.preventDefault();
        log("Bouton Jouer touché");
        startLevel();
    });

    function startLevel() {
        document.getElementById('ui-main').classList.add('hidden');
        state = 'PLAYING';
        obstacles = [];
        player.y = canvas.height / 2;
        log("État: PLAYING");
        requestAnimationFrame(loop);
    }

    // --- BOUCLE DE JEU ---
    function loop() {
        if (state !== 'PLAYING') return;

        ctx.fillStyle = "#0a0a15";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        const groundY = canvas.height - 100;

        // Sol
        ctx.fillStyle = "#00ffff";
        ctx.fillRect(0, groundY, canvas.width, 2);

        // Physique Joueur
        player.dy += player.gravity;
        player.y += player.dy;

        if (player.y + player.size > groundY) {
            player.y = groundY - player.size;
            player.dy = 0;
            player.grounded = true;
        }

        // Joueur
        ctx.fillStyle = "#00ff00";
        ctx.shadowBlur = 15; ctx.shadowColor = "#00ff00";
        ctx.fillRect(player.x, player.y, player.size, player.size);
        ctx.shadowBlur = 0;

        // Obstacles auto
        if (Math.random() < 0.02) {
            obstacles.push({ x: canvas.width, w: 30, h: 40 });
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].x -= 7;
            
            // Dessin pique
            ctx.fillStyle = "red";
            ctx.beginPath();
            ctx.moveTo(obstacles[i].x, groundY);
            ctx.lineTo(obstacles[i].x + 15, groundY - 40);
            ctx.lineTo(obstacles[i].x + 30, groundY);
            ctx.fill();

            // Collision
            if (player.x < obstacles[i].x + 30 && player.x + player.size > obstacles[i].x &&
                player.y + player.size > groundY - 40) {
                log("Collision!");
                location.reload();
            }

            if (obstacles[i].x < -50) obstacles.splice(i, 1);
        }

        requestAnimationFrame(loop);
    }

    // --- SAUT ---
    function doJump() {
        if (state === 'PLAYING' && player.grounded) {
            player.dy = player.jump;
            player.grounded = false;
            log("Saut !");
        }
    }

    window.addEventListener('touchstart', (e) => {
        if (state === 'PLAYING') {
            e.preventDefault();
            doJump();
        }
    }, { passive: false });

    window.addEventListener('mousedown', () => { if(state === 'PLAYING') doJump(); });

</script>
</body>
</html>
