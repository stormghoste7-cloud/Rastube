<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibes App</title>
    <style>
        :root {
            --primary: #6366f1; /* Bleu type Twitch/Insta */
            --bg: #0f172a;      /* Sombre type TikTok/Twitch */
            --surface: #1e293b;
            --text: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .phone {
            width: 100%;
            max-width: 350px;
            padding: 40px 25px;
            text-align: center;
        }

        /* --- LOGO STYLE INSTA/TWITCH --- */
        .logo-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            margin: 0 auto 20px;
            border-radius: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        h1 { font-size: 32px; font-weight: 800; margin: 0; letter-spacing: -1px; }
        p { color: #94a3b8; margin-bottom: 30px; }

        .form-group { display: block; width: 100%; }
        
        /* Cacher l'inscription par défaut */
        #signup-section { display: none; }

        input {
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #334155;
            border-radius: 14px;
            background-color: var(--surface);
            color: white;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
        }

        input:focus { border-color: var(--primary); }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-main { background-color: var(--primary); color: white; margin-top: 10px; }
        .btn-main:hover { opacity: 0.9; transform: scale(0.98); }

        .btn-link { background: none; color: #94a3b8; font-size: 14px; margin-top: 15px; }

        #msg { margin-top: 15px; font-size: 14px; font-weight: 500; }
    </style>
</head>
<body>

    <div class="phone">
        <div class="logo-box">V</div>
        <h1>Vibes</h1>
        <p id="tagline">Partage ton mood, trouve ta vibe.</p>

        <div id="login-section">
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-pass" placeholder="Mot de passe">
            <button class="btn-main" onclick="action('connexion')">Se connecter</button>
            <button class="btn-link" onclick="switchPage('signup')">Pas de compte ? Créer un profil</button>
        </div>

        <div id="signup-section">
            <input type="text" id="sign-name" placeholder="Nom complet">
            <input type="email" id="sign-email" placeholder="Email">
            <input type="password" id="sign-pass" placeholder="Créer un mot de passe">
            <button class="btn-main" onclick="action('inscription')">Créer mon profil</button>
            <button class="btn-link" onclick="switchPage('login')">Déjà un compte ? Se connecter</button>
        </div>

        <div id="msg"></div>
    </div>

    <script>
        // Logique pour changer d'écran
        function switchPage(page) {
            const login = document.getElementById('login-section');
            const signup = document.getElementById('signup-section');
            const tagline = document.getElementById('tagline');

            if (page === 'signup') {
                login.style.display = 'none';
                signup.style.display = 'block';
                tagline.innerText = "Rejoins la communauté Vibes.";
            } else {
                login.style.display = 'block';
                signup.style.display = 'none';
                tagline.innerText = "Partage ton mood, trouve ta vibe.";
            }
        }

        // Logique des boutons
        function action(type) {
            const msg = document.getElementById('msg');
            msg.style.color = "#34d399"; // Vert
            
            if (type === 'connexion') {
                const email = document.getElementById('login-email').value;
                if(!email) { msg.style.color = "#fb7185"; msg.innerText = "Remplis ton email !"; return; }
                msg.innerText = "Connexion de " + email + "...";
            } else {
                const name = document.getElementById('sign-name').value;
                if(!name) { msg.style.color = "#fb7185"; msg.innerText = "Quel est ton nom ?"; return; }
                msg.innerText = "Profil créé pour " + name + " !";
            }
        }
    </script>
</body>
</html>
