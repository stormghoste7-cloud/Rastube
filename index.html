<!-- Interface de sélection de mood -->
<div class="mood-selector">
  <h3>Comment tu te sens aujourd'hui ?</h3>
  <div class="moods-grid">
    <div class="mood-option" data-mood="happy" onclick="selectMood('happy', '😊')">
      <span class="emoji">😊</span>
      <span>Heureux</span>
    </div>
    <div class="mood-option" data-mood="sad" onclick="selectMood('sad', '😢')">
      <span class="emoji">😢</span>
      <span>Triste</span>
    </div>
    <!-- Ajouter 10+ moods -->
  </div>
</div>
